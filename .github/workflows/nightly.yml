name: Nightly ingest, build, deploy

on:
  schedule:
    # 07:37 UTC (02:37 Eastern in winter, 03:37 in summer). The run takes about an hour, so it ends before DC's permit
    # layer reloads around 10:27-10:34 UTC and answers "none"; the old 09:15 start ran into that window (Nov 10, 16, 20).
    # An odd minute: GitHub delays or drops scheduled runs when busy, worst at :00 and common at :30.
    - cron: "37 7 * * *"
  workflow_dispatch:
  # A push rebuilds and redeploys from the data already committed; only the nightly run (and a manual run) fetches
  # DC's data again. The full ingest takes about an hour, so running it on every push used up the private repo's
  # Actions minutes (22 pushes in early November 2026 cost about 1,000 minutes). To try a change to ingest/ right
  # away, run the workflow by hand from the Actions tab.
  push:
    branches: [main]
    paths: ["site/**", "worker/**", "ingest/**", "wrangler.jsonc", "crime/**"]

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150  # 40 neighborhoods took 55-70 minutes in November 2026; DC retries can add more (a push run takes a few)
    env:
      # Until the Cloudflare token is added as a repo secret, ingest and build still run; only deploy is skipped.
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.13"

      # If DC's data is missing, empty or contains personal fields, this step fails. The job then still builds and
      # deploys the last good snapshot (the site flags data older than 3 days) and fails at the end, so GitHub emails you.
      - name: Ingest DC open data
        id: ingest
        if: github.event_name != 'push'
        continue-on-error: true
        run: python ingest/run.py --check

      - name: Fall back to the last good snapshot
        if: steps.ingest.outcome == 'failure'
        run: |
          git checkout -- site/src/data
          echo "::warning::Ingest failed; deploying the last committed data instead."

      # Counts for the private crime site (crime/, crime.georgetowndc.org, behind Cloudflare Access). Its own step, so a
      # failure here never holds back the neighborhood sites; the crime site then keeps its last good counts.
      - name: Count crime for the private site
        id: crime
        if: github.event_name != 'push'
        continue-on-error: true
        run: python ingest/crime.py --check

      - name: Keep the last good crime counts
        if: steps.crime.outcome == 'failure'
        run: |
          git checkout -- crime/src/data
          echo "::warning::Crime counts failed; the crime site keeps the last committed counts."

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            crime/package-lock.json

      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Verify build output
        run: node tools/verify.mjs site

      - name: Build the crime site
        working-directory: crime
        run: |
          npm ci
          npm run build

      # Keeping each night's JSON in git gives free history for week-over-week comparisons.
      - name: Commit data snapshot
        if: steps.ingest.outcome == 'success'
        run: |
          git config user.name "dc-neighborhoods-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/src/data crime/src/data
          git diff --cached --quiet || git commit -m "data: nightly snapshot $(date -u +%F)"
          git push

      - name: Deploy skipped (no Cloudflare token yet)
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so this run built the site but did not deploy it."

      - name: Deploy to Cloudflare
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action's default wrangler is too old to read wrangler.jsonc; pin the version tested locally.
          wranglerVersion: "4.156.0"
          command: deploy

      # The live transit board (worker/transit.js) needs WMATA's key as a Worker secret. Copying the GitHub secret
      # across each night means the key only has to be set in one place; without it the board shows bikeshare only.
      - name: Pass the WMATA key to the Worker
        if: env.HAS_CF_TOKEN == 'true'
        env:
          WMATA_API_KEY: ${{ secrets.WMATA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$WMATA_API_KEY" ]; then
            echo "::notice::WMATA_API_KEY is not set, so live Metro and bus times stay off (bikeshare still works)."
            exit 0
          fi
          printf '%s' "$WMATA_API_KEY" | npx --yes wrangler@4.156.0 secret put WMATA_API_KEY

      # Its own Worker (crime/wrangler.jsonc), with no workers.dev address, so Access on crime.georgetowndc.org is the
      # only way in.
      - name: Deploy the crime site
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.0"
          workingDirectory: crime
          command: deploy

      - name: Report a failed ingest
        if: steps.ingest.outcome == 'failure'
        run: |
          echo "::error::Tonight's ingest failed (see the Ingest step). The site was redeployed with the last good data."
          exit 1

      - name: Report failed crime counts
        if: steps.crime.outcome == 'failure'
        run: |
          echo "::error::Tonight's crime counts failed (see the Count crime step). The crime site kept its last good counts."
          exit 1
