name: Nightly ingest, build, deploy

on:
  schedule:
    - cron: "15 9 * * *" # 05:15 Eastern (EDT), after DC's overnight dataset refresh
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "worker/**", "ingest/**", "wrangler.jsonc"]

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # 13 neighborhoods take about 35 minutes; DC retries can add more
    env:
      # Until the Cloudflare token is added as a repo secret, ingest and build still run; only deploy is skipped.
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # If DC's data is missing, empty or contains personal fields, this step fails. The job then still builds and
      # deploys the last good snapshot (the site flags data older than 3 days) and fails at the end, so GitHub emails you.
      - name: Ingest DC open data
        id: ingest
        continue-on-error: true
        run: python ingest/run.py --check

      - name: Fall back to the last good snapshot
        if: steps.ingest.outcome != 'success'
        run: |
          git checkout -- site/src/data
          echo "::warning::Ingest failed; deploying the last committed data instead."

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Verify build output
        run: node tools/verify.mjs site

      # Keeping each night's JSON in git gives free history for week-over-week comparisons.
      - name: Commit data snapshot
        if: steps.ingest.outcome == 'success'
        run: |
          git config user.name "dc-neighborhoods-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/src/data
          git diff --cached --quiet || git commit -m "data: nightly snapshot $(date -u +%F)"
          git push

      - name: Deploy skipped (no Cloudflare token yet)
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so this run built the site but did not deploy it."

      - name: Deploy to Cloudflare
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action's default wrangler is too old to read wrangler.jsonc; pin the version tested locally.
          wranglerVersion: "4.156.0"
          command: deploy

      # The live transit board (worker/transit.js) needs WMATA's key as a Worker secret. Copying the GitHub secret
      # across each night means the key only has to be set in one place; without it the board shows bikeshare only.
      - name: Pass the WMATA key to the Worker
        if: env.HAS_CF_TOKEN == 'true'
        env:
          WMATA_API_KEY: ${{ secrets.WMATA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$WMATA_API_KEY" ]; then
            echo "::notice::WMATA_API_KEY is not set, so live Metro and bus times stay off (bikeshare still works)."
            exit 0
          fi
          printf '%s' "$WMATA_API_KEY" | npx --yes wrangler@4.156.0 secret put WMATA_API_KEY

      - name: Report a failed ingest
        if: steps.ingest.outcome != 'success'
        run: |
          echo "::error::Tonight's ingest failed (see the Ingest step). The site was redeployed with the last good data."
          exit 1
